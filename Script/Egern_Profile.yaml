      policies: ["美国-自动选择"]
      urls: *sub
      filter: "(?i)^(?!.*(❌|✖|⚠|群|返利|循环|官网|客服|网站|网址|获取|订阅|流量|到期|机场|下次|版本|官址|备用|过期|已用|联系|邮箱|工单|贩卖|通知|倒卖|防止|国内|地址|频道|无法|说明|使用|提示|访问|支持|教程|关注|更新|作者|加入|超时|收藏|福利|邀请|好友|失联|剩余|公益|发布|DIZTNA|通路|登录|禁止|定时|渠道|牢记|永久|余额|阁下|本站|刷新|导航|建议|重置|以下|@|expire|http|\\.com|traffic)).*(美国|美西|美东|🇺🇸|🇺🇲|洛杉矶|圣何塞|圣荷西|旧金山|西雅图|芝加哥|纽约|硅谷|达拉斯|凤凰城|弗吉尼亚|(?<![a-z])USA?(?![a-z])|united ?states|america)"
      icon: "https://fastly.jsdelivr.net/gh/Koolson/Qure@master/IconSet/Color/United_States.png"

  - select:
      name: "台湾"
      policies: ["台湾-自动选择"]
      urls: *sub
      filter: "(?i)^(?!.*(❌|✖|⚠|群|返利|循环|官网|客服|网站|网址|获取|订阅|流量|到期|机场|下次|版本|官址|备用|过期|已用|联系|邮箱|工单|贩卖|通知|倒卖|防止|国内|地址|频道|无法|说明|使用|提示|访问|支持|教程|关注|更新|作者|加入|超时|收藏|福利|邀请|好友|失联|剩余|公益|发布|DIZTNA|通路|登录|禁止|定时|渠道|牢记|永久|余额|阁下|本站|刷新|导航|建议|重置|以下|@|expire|http|\\.com|traffic)).*(台湾|台北|台中|新北|🇹🇼|(?<![a-z])TWN?(?![a-z])|taiwan)"
      icon: "https://fastly.jsdelivr.net/gh/Koolson/Qure@master/IconSet/Color/Taiwan.png"

  - select:
      name: "日本"
      policies: ["日本-自动选择"]
      urls: *sub
