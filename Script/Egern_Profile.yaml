  - domain_suffix:
      match: threads.net
      policy: Meta
  - domain_suffix:
      match: threads.com
      policy: Meta
  - domain_suffix:
      match: meta.com
      policy: Meta

  # FCM：仅匹配推送相关域名，避免把全部 Google API 流量误送到 FCM 组
  - domain:
      match: mtalk.google.com
      policy: FCM
  - domain_suffix:
      match: googleapis.com
      policy: Google

  # Google
  - domain_suffix:
      match: google.com
      policy: Google
  - domain_suffix:
      match: google.co.jp
      policy: Google
  - domain_suffix:
