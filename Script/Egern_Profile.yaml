# ============================================================
#  Egern 配置（由 Remnawave · Mihomo 软路由多端通用版 移植）
#  使用前：把下方「默认代理」组里的订阅链接替换为你自己的 Remnawave 订阅链接（只改这一处）
# ============================================================

# --- 基础全局配置 ---
ipv6: true
http_port: 7890
socks_port: 7891
# iOS 上不对局域网开放代理端口（对应 mihomo allow-lan，手机端无需开启）
allow_external_connections: false
# 劫持所有 53 端口 DNS（对应 mihomo dns-hijack any:53）
hijack_dns:
  - "*:53"
# 全局阻止 QUIC，强制回落 TCP；「直连」组单独放行（对应 mihomo「拦截非国内 QUIC」规则）
block_quic: true
# 测速地址与 mihomo 保持一致
proxy_latency_test_url: "https://www.gstatic.com/generate_204"
# 使用 Loyalsoldier 增强版 GeoIP（国内 IP 段更准确，下载失败时自动回退内置库）
geoip_db_url: "https://raw.githubusercontent.com/Loyalsoldier/geoip/release/Country-without-asn.mmdb"

# 使用真实 IP 的域名（对应 mihomo fake-ip-filter：局域网 / 联网检测 / NTP / 游戏联机 / QQ 快捷登录 / 智能家居 / 内网穿透）
real_ip_domains:
  - "localhost"
  - "*.localhost"
  - "*.local"
  - "*.lan"
  - "*.home.arpa"
  - "*.msftconnecttest.com"
  - "msftconnecttest.com"
  - "*.msftncsi.com"
  - "msftncsi.com"
  - "captive.apple.com"
  - "connectivitycheck.gstatic.com"
  - "*.connectivitycheck.platform.hicloud.com"
  - "connect.rom.miui.com"
  - "*.pool.ntp.org"
  - "time.*.com"
  - "ntp.*.com"
  - "localhost.ptlogin2.qq.com"
  - "localhost.sec.qq.com"
  - "*.srv.nintendo.net"
  - "*.stun.playstation.net"
  - "xbox.*.microsoft.com"
  - "*.xboxlive.com"
  - "xboxlive.com"
  - "*.battlenet.com.cn"
  - "*.io.mi.com"
  - "*.market.xiaomi.com"
  - "*.oray.com"
  - "oray.com"
  - "*.sunlogin.net"
  - "sunlogin.net"
  - "*.push.apple.com"

# --- DNS ---
dns:
  # 启动 DNS（仅 UDP，用于兜底）
  bootstrap:
    - 223.5.5.5
    - 119.29.29.29
  upstreams:
    # 国内加密 DoH（直连）
    china:
      - "https://dns.alidns.com/dns-query"
      - "https://doh.pub/dns-query"
    # 海外加密 DoH（Egern 默认 DNS 连接上游时遵循代理规则，会经「默认代理 / Google」组出站）
    foreign:
      - "https://dns.cloudflare.com/dns-query"
      - "https://dns.google/dns-query"
  forward:
    # 局域网主机名交给系统 DNS（即路由器）解析
    - domain:
        match: "localhost"
        value: system
    - domain_suffix:
        match: "localhost"
        value: system
    - domain_suffix:
        match: "local"
        value: system
    - domain_suffix:
        match: "lan"
        value: system
    - domain_suffix:
        match: "home.arpa"
        value: system
    # 国内域名走国内 DoH
    - proxy_rule_set:
        match: "https://raw.githubusercontent.com/blackmatrix7/ios_rule_script/master/rule/Surge/ChinaMax/ChinaMax.list"
        value: china
        update_interval: 86400
    # 其余域名走海外 DoH
    - domain_wildcard:
        match: "*"
        value: foreign
  # 代理服务器域名解析：强制直连国内 DoH（对应 mihomo proxy-server-nameserver）
  proxy_nameservers:
    - "https://dns.alidns.com/dns-query"
    - "https://doh.pub/dns-query"
  hosts:
    "dns.alidns.com": ["223.5.5.5", "223.6.6.6"]
    "doh.pub": ["1.12.12.12", "120.53.53.53"]
    "dns.cloudflare.com": ["1.1.1.1", "1.0.0.1"]
    "dns.google": ["8.8.8.8", "8.8.4.4"]
    # 解决谷歌商店无法下载的问题
    "services.googleapis.cn": "services.googleapis.com"
    # 屏蔽哔哩哔哩 PCDN（规则中另有 REJECT 双保险）
    "*.mcdn.bilivideo.com": "0.0.0.0"
    "*.mcdn.bilivideo.cn": "0.0.0.0"
    "*.edge.mountaintoys.cn": "0.0.0.0"

# --- 策略组 ---
# 说明：
#   - Egern 没有 exclude-filter，排除逻辑统一写成 ^(?!.*(排除词)) 负向前瞻，并与包含条件合并到 filter。
#   - filter 只作用于 urls 订阅节点；policies 里的静态策略组不会被 filter 过滤（未开启 flatten）。
#   - 订阅链接用 YAML 锚点 &sub 定义一次，其余组用 *sub 引用。
#   - Egern 的 timeout 单位为秒（mihomo 为毫秒），2000ms → 2。
policy_groups:
  # --- 1. 默认代理：8 个组 + 仅保留带 ❌ 的提示节点 ---
  - select:
      name: "默认代理"
      policies: ["自动选择", "手动选择", "香港", "日本", "美国", "新加坡", "台湾", "其他节点"]
      urls: &sub
        - "https://你的Remnawave订阅链接"
      filter: "(❌|✖)"
      icon: "https://fastly.jsdelivr.net/gh/Koolson/Qure@master/IconSet/Color/Proxy.png"

  # --- 2. 自动选择（首位放 香港-自动选择 兜底 + 全部 ⚡ 节点） ---
  - auto_test:
      name: "自动选择"
      policies: ["香港-自动选择"]
      urls: *sub
      filter: "(?i)^(?!.*(⚠|群|返利|循环|官网|客服|网站|网址|获取|订阅|流量|到期|机场|下次|版本|官址|备用|过期|已用|联系|邮箱|工单|贩卖|通知|倒卖|防止|国内|地址|频道|无法|说明|使用|提示|访问|支持|教程|关注|更新|作者|加入|超时|收藏|福利|邀请|好友|失联|剩余|公益|发布|DIZTNA|通路|登录|禁止|定时|渠道|牢记|永久|余额|阁下|本站|刷新|导航|建议|重置|以下|@|expire|http|\\.com|traffic)).*⚡"
      interval: 300
      tolerance: 50
      timeout: 2
      icon: "https://fastly.jsdelivr.net/gh/Koolson/Qure@master/IconSet/Color/Auto.png"

  # --- 3. 手动选择（全部节点，含 ❌ 提示节点） ---
  - select:
      name: "手动选择"
      urls: *sub
      filter: "(?i)^(?!.*(⚠|群|返利|循环|官网|客服|网站|网址|获取|订阅|流量|到期|机场|下次|版本|官址|备用|过期|已用|联系|邮箱|工单|贩卖|通知|倒卖|防止|国内|地址|频道|无法|说明|使用|提示|访问|支持|教程|关注|更新|作者|加入|超时|收藏|福利|邀请|好友|失联|剩余|公益|发布|DIZTNA|通路|登录|禁止|定时|渠道|牢记|永久|余额|阁下|本站|刷新|导航|建议|重置|以下|@|expire|http|\\.com|traffic)).+"
      icon: "https://fastly.jsdelivr.net/gh/Koolson/Qure@master/IconSet/Color/Static.png"

  # --- 4. 地区组：第一项为各自的「XX-自动选择」，并排除 ❌ 提示节点 ---
  - select:
      name: "香港"
      policies: ["香港-自动选择"]
      urls: *sub
      filter: "(?i)^(?!.*(❌|✖|⚠|群|返利|循环|官网|客服|网站|网址|获取|订阅|流量|到期|机场|下次|版本|官址|备用|过期|已用|联系|邮箱|工单|贩卖|通知|倒卖|防止|国内|地址|频道|无法|说明|使用|提示|访问|支持|教程|关注|更新|作者|加入|超时|收藏|福利|邀请|好友|失联|剩余|公益|发布|DIZTNA|通路|登录|禁止|定时|渠道|牢记|永久|余额|阁下|本站|刷新|导航|建议|重置|以下|@|expire|http|\\.com|traffic)).*(香港|🇭🇰|(?<![a-z])HK[GT]?(?![a-z])|hong ?kong)"
      icon: "https://fastly.jsdelivr.net/gh/Koolson/Qure@master/IconSet/Color/Hong_Kong.png"

  - select:
