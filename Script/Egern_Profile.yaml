  - 223.5.5.5
  - 119.29.29.29
  upstreams:
    Domestic-Encrypted-DNS:
    - https://dns.alidns.com/dns-query
    - https://doh.pub/dns-query
    Foreign-Encrypted-DNS:
    - https://dns.cloudflare.com/dns-query
    - https://dns.google/dns-query
  forward:
  - proxy_rule_set:
      match: https://github.com/Repcz/Tool/raw/X/Egern/Rules/Reject.yaml
      value: reject
      disabled: false
      update_interval: 86400
  - proxy_rule_set:
      match: https://github.com/Repcz/Tool/raw/X/Egern/Rules/ChinaDomain.yaml
      value: Domestic-Encrypted-DNS
      disabled: false
      update_interval: 86400
  - domain_wildcard:
      match: '*'
      value: Foreign-Encrypted-DNS
      disabled: false
  hosts:
    dns.alidns.com:
    - 223.5.5.5
    - 223.6.6.6
    doh.pub:
    - 1.12.12.12
    - 120.53.53.53
    dot.pub:
    - 1.12.12.12
    - 120.53.53.53
    dns.cloudflare.com:
    - 1.1.1.1
    - 1.0.0.1
    dns.google:
    - 8.8.8.8
    - 8.8.4.4
    cloudflare-dns.com:
    - 104.16.249.249
    - 104.16.248.249
    services.googleapis.cn: services.googleapis.com
    mcdn.bilivideo.com:
    - 0.0.0.0
    '*.mcdn.bilivideo.com':
    - 0.0.0.0
    mcdn.bilivideo.cn:
    - 0.0.0.0
    '*.mcdn.bilivideo.cn':
    - 0.0.0.0
    edge.mountaintoys.cn:
    - 0.0.0.0
    '*.edge.mountaintoys.cn':
    - 0.0.0.0
  proxy_nameservers:
  - https://dns.alidns.com/dns-query
  - https://doh.pub/dns-query
