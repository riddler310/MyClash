# --- 路由规则 ---
# 规则集来源：blackmatrix7（Surge 格式）、Sukka（AI / Apple / 微软 CDN）、Repcz（Telegram，Egern 原生格式）
rules:
  # 局域网优先直连
  - domain:
      match: "localhost"
      policy: 直连
  - domain_suffix:
      match: "localhost"
      policy: 直连
  - domain_suffix:
      match: "local"
      policy: 直连
  - domain_suffix:
      match: "lan"
      policy: 直连
  - domain_suffix:
      match: "home.arpa"
      policy: 直连
  - ip_cidr:
      match: 0.0.0.0/8
      policy: 直连
      no_resolve: true
  - ip_cidr:
      match: 10.0.0.0/8
      policy: 直连
      no_resolve: true
  - ip_cidr:
      match: 100.64.0.0/10
      policy: 直连
      no_resolve: true
  - ip_cidr:
      match: 127.0.0.0/8
      policy: 直连
      no_resolve: true
  - ip_cidr:
      match: 169.254.0.0/16
      policy: 直连
      no_resolve: true
  - ip_cidr:
      match: 172.16.0.0/12
      policy: 直连
      no_resolve: true
  - ip_cidr:
      match: 192.168.0.0/16
      policy: 直连
      no_resolve: true
  - ip_cidr:
      match: 224.0.0.0/4
      policy: 直连
      no_resolve: true
  - ip_cidr:
      match: 255.255.255.255/32
      policy: 直连
      no_resolve: true
  - ip_cidr6:
      match: "::1/128"
      policy: 直连
      no_resolve: true
  - ip_cidr6:
      match: "fc00::/7"
      policy: 直连
      no_resolve: true
  - ip_cidr6:
      match: "fe80::/10"
      policy: 直连
      no_resolve: true
  - ip_cidr6:
      match: "ff00::/8"
      policy: 直连
      no_resolve: true

  # 防 WebRTC 泄露：拦截 STUN/TURN 探测域名、端口与 STUN 协议（PlayStation 联机放行）
  - domain_suffix:
      match: "stun.playstation.net"
      policy: 直连
  - domain_regex:
      match: '^([a-zA-Z0-9-]+\.)*stun[0-9]*\.'
      policy: REJECT
  - dest_port:
      match: "3478-3479,5349-5350,19302-19309"
      policy: REJECT
  - protocol:
      match: stun
      policy: REJECT

  # 屏蔽哔哩哔哩 PCDN
  - domain_suffix:
      match: "mcdn.bilivideo.com"
      policy: REJECT
  - domain_suffix:
      match: "mcdn.bilivideo.cn"
      policy: REJECT
  - domain_suffix:
      match: "edge.mountaintoys.cn"
      policy: REJECT

  - rule_set:
      match: "https://raw.githubusercontent.com/blackmatrix7/ios_rule_script/master/rule/Surge/SteamCN/SteamCN.list"
      policy: 直连
      update_interval: 86400
