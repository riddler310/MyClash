      policy: Media
  - domain_suffix:
      match: disneyplus.com
      policy: Media
  - domain_suffix:
      match: hbomax.com
      policy: Media
  - domain_suffix:
      match: max.com
      policy: Media
  - domain_suffix:
      match: twitch.tv
      policy: Media
  - domain_suffix:
      match: bbc.co.uk
      policy: Media
  - domain_suffix:
      match: niconico.jp
      policy: Media
  - domain_suffix:
      match: pornhub.com
      policy: Media
  - domain_suffix:
      match: phncdn.com
      policy: Media
  - domain_suffix:
      match: pornhubpremium.com
      policy: Media

  # Meta 全系
  - domain_suffix:
      match: facebook.com
      policy: Meta
  - domain_suffix:
      match: facebook.net
      policy: Meta
  - domain_suffix:
      match: fbcdn.net
      policy: Meta
  - domain_suffix:
      match: fbsbx.com
      policy: Meta
  - domain_suffix:
      match: instagram.com
      policy: Meta
  - domain_suffix:
      match: cdninstagram.com
      policy: Meta
  - domain_suffix:
      match: whatsapp.com
      policy: Meta
  - domain_suffix:
      match: whatsapp.net
