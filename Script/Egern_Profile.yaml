rules:
- rule_set:
    match: https://github.com/Repcz/Tool/raw/X/Egern/Rules/Lan.yaml
    policy: DIRECT
    update_interval: 86400
    name: 局域网直连
- ip_cidr:
    match: 10.0.0.0/8
    name: RFC1918-10
    policy: DIRECT
- ip_cidr:
    match: 172.16.0.0/12
    name: RFC1918-172
    policy: DIRECT
- ip_cidr:
    match: 192.168.0.0/16
    name: RFC1918-192
    policy: DIRECT
- ip_cidr:
    match: 127.0.0.0/8
    name: Loopback
    policy: DIRECT
- ip_cidr6:
    match: fc00::/7
    name: IPv6-ULA
    policy: DIRECT
- ip_cidr6:
    match: fe80::/10
    name: IPv6-LinkLocal
    policy: DIRECT
- domain:
