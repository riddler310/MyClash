rules:
# 屏蔽哔哩哔哩 PCDN (mihomo hosts 里指向 0.0.0.0 的三个域名)
- domain_suffix:
    match: mcdn.bilivideo.com
    policy: REJECT
- domain_suffix:
    match: mcdn.bilivideo.cn
    policy: REJECT
- domain_suffix:
    match: edge.mountaintoys.cn
    policy: REJECT
# GitHub 走默认代理
- rule_set:
    match: https://fastly.jsdelivr.net/gh/MetaCubeX/meta-rules-dat@meta/geo/geosite/classical/github.list
    policy: 默认代理
# 禁用国外 QUIC (UDP 443), 国内域名/IP 除外
- and:
    name: Block Foreign QUIC
    match:
    - protocol:
        match: udp
    - dest_port:
        match: '443'
    - not:
        match:
          or:
            match:
            - rule_set:
                match: https://github.com/Repcz/Tool/raw/X/Egern/Rules/ChinaDomain.yaml
            - geoip:
                match: CN
                no_resolve: true
    policy: REJECT
# 私有网络直连
- rule_set:
    match: https://fastly.jsdelivr.net/gh/MetaCubeX/meta-rules-dat@meta/geo/geosite/classical/private.list
    policy: DIRECT
