policy_groups:
# 节点来源: 把 urls 换成你的订阅链接
- external:
    name: 手动选择
    type: select
    urls:
    - http://your-service-provider
    # 机场的流量/到期等信息节点混进来时, 可启用下面的过滤(需要 Egern 的正则支持负向先行断言)
    # filter: '(?i)^(?!.*(群|❌|返利|循环|官网|客服|网站|网址|获取|订阅|流量|到期|机场|下次|版本|官址|备用|过期|已用|联系|邮箱|工单|贩卖|通知|倒卖|防止|国内|地址|频道|无法|说明|使用|提示|访问|支持|教程|关注|更新|作者|加入|超时|收藏|福利|邀请|好友|失联|选择|剩余|公益|发布|DIZTNA|通路|登录|禁止|定时|渠道|牢记|永久|余额|阁下|本站|刷新|导航|建议|重置|以下|⚠️|@|expire|http|com|traffic)).*$'
    hidden: false
    icon: https://fastly.jsdelivr.net/gh/Koolson/Qure@master/IconSet/Color/Static.png
- select:
    name: 默认代理
    policies:
    - 香港
    - 日本
    - 美国
    - 新加坡
    - 台湾省
    - 手动选择
    - 自动选择
