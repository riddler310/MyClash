# 由 mihomo 覆写脚本(AIsouler/MyClash)转换而来的 Egern 配置
# Egern Version ≥ v2.20.0
# 官方文档: https://doc.egernapp.com
#
# 使用前: 把下面 policy_groups 里「手动选择」的 urls 换成你的机场订阅链接
# 以 ; 或 # 或 // 开头的行为注释行
# ================
ipv6: false
vif_only: true
hijack_dns:
- '*:53'
geoip_db_url: https://raw.githubusercontent.com/Loyalsoldier/geoip/release/Country-without-asn.mmdb
proxy_latency_test_url: http://cp.cloudflare.com/generate_204
direct_latency_test_url: http://cp.cloudflare.com/generate_204
dns:
  bootstrap:
  - 223.5.5.5
  - 119.29.29.29
  upstreams:
    Domestic-Encrypted-DNS:
    - https://dns.alidns.com/dns-query
    - https://doh.pub/dns-query
    Foreign-Encrypted-DNS:
    - https://cloudflare-dns.com/dns-query
    - https://dns.google/dns-query
  forward:
  - proxy_rule_set:
      match: https://github.com/Repcz/Tool/raw/X/Egern/Rules/ChinaDomain.yaml
      value: Domestic-Encrypted-DNS
  - domain_wildcard:
      match: '*'
      value: Foreign-Encrypted-DNS
  hosts:
    dns.alidns.com:
    - 223.5.5.5
    - 223.6.6.6
    doh.pub:
    - 1.12.12.12
    - 120.53.53.53
    cloudflare-dns.com:
    - 1.1.1.1
    - 1.0.0.1
    dns.google:
    - 8.8.8.8
    - 8.8.4.4
    services.googleapis.cn: services.googleapis.com
  proxy_nameservers:
  - https://dns.alidns.com/dns-query
  - https://doh.pub/dns-query
