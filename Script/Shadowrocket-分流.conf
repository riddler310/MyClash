### 为什么没有图标？

这是 **Shadowrocket（小火箭）客户端本身的界面限制**：
- 在 Clash（FlClash / Clash Party）、Stash、Loon、Surge 里，策略组支持通过 `icon:` / `img-url=` 加载外部彩色 PNG/SVG 图片链接。
- 而**小火箭原生的「代理分组」列表左侧没有图片槽位，也不解析任何外部图标 URL**（写入也会被直接忽略）。在小火箭里想让代理分组带图标，唯一的原生方式是在**分组名称前加上 Emoji 图标**（如 `🚀 默认代理`、`🇭🇰 香港`、`🤖 AI`）。

